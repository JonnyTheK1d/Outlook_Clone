name: Windows build
on:
  push:
    branches: [main]
    paths-ignore: ['installers/**', 'docs/**', 'README.md', '.gitattributes']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm test
      - name: Native Electron and Windows DPAPI checks
        run: npm run test:native
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npm.cmd run dist:win 2>&1 | Tee-Object -FilePath build-win.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            '## Windows build failure' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '~~~text' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content build-win.log -Tail 60 | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '~~~' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $tail = (Get-Content build-win.log -Tail 20) -join [Environment]::NewLine
            $escaped = $tail.Replace('%', '%25').Replace([string][char]13, '%0D').Replace([string][char]10, '%0A')
            Write-Output "::error title=Windows installer build::$escaped"
            exit $buildExit
          }
      - name: Verify installed Windows app and Mailto registration
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*Setup.exe | Select-Object -First 1
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash + '  ' + $installer.Name
          Set-Content -LiteralPath release/SHA256SUMS -Value $checksum
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName -Checksums release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Postblick-Windows-x64
          path: |
            release/*Setup.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
